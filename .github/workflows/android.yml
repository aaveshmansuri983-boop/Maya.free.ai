name: Build Maya AI Free Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Maya AI Free build config
        uses: actions/checkout@v4

      - name: Checkout upstream Maya source
        uses: actions/checkout@v4
        with:
          repository: piashmsubd/Maya-ai-automation-android
          ref: master
          path: maya-source

      - name: Apply free app identity
        working-directory: maya-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle.kts")
          gradle_text = gradle.read_text()
          old_id = 'applicationId = "com.maya.ai"'
          new_id = 'applicationId = "com.maya.ai.free"'
          if old_id in gradle_text:
              gradle_text = gradle_text.replace(old_id, new_id)
          if new_id not in gradle_text:
              raise SystemExit("Could not verify applicationId in app/build.gradle.kts")
          gradle.write_text(gradle_text)

          strings = Path("app/src/main/res/values/strings.xml")
          xml = strings.read_text()
          xml = xml.replace('<string name="app_name">Maya AI</string>',
                            '<string name="app_name">Maya AI Free</string>')
          if "Maya AI Free" not in xml:
              raise SystemExit("Could not set app_name in strings.xml")
          strings.write_text(xml)
          PY

      - name: Configure installable release signing
        working-directory: maya-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = """        release {
            isMinifyEnabled = true"""
          new = """        release {
            // Temporary installable CI signing. Replace with a private release keystore before public distribution.
            signingConfig = signingConfigs.getByName("debug")
            isMinifyEnabled = false"""
          if old not in s:
              raise SystemExit("Release build block did not match expected source; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build signed release APK
        working-directory: maya-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-AI-Free-release
          path: maya-source/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
