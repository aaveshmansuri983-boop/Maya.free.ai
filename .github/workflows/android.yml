name: Build Maya AI Free Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Maya AI Free build config
        uses: actions/checkout@v4

      - name: Checkout upstream Maya source
        uses: actions/checkout@v4
        with:
          repository: piashmsubd/Maya-ai-automation-android
          ref: master
          path: maya-source

      - name: Apply free app identity
        working-directory: maya-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle.kts")
          gradle_text = gradle.read_text()
          old_id = 'applicationId = "com.maya.ai"'
          new_id = 'applicationId = "com.maya.ai.free"'
          if old_id in gradle_text:
              gradle_text = gradle_text.replace(old_id, new_id)
          if new_id not in gradle_text:
              raise SystemExit("Could not verify applicationId in app/build.gradle.kts")
          gradle.write_text(gradle_text)

          strings = Path("app/src/main/res/values/strings.xml")
          xml = strings.read_text()
          xml = xml.replace('<string name="app_name">Maya AI</string>',
                            '<string name="app_name">Maya AI Free</string>')
          if "Maya AI Free" not in xml:
              raise SystemExit("Could not set app_name in strings.xml")
          strings.write_text(xml)
          PY

      - name: Apply Maya chat, voice and orb fixes
        working-directory: maya-source
        shell: bash
        run: |
          set -euo pipefail
          cp ../patches/ChatScreen.kt app/src/main/java/com/maya/ai/presentation/chat/ChatScreen.kt
          cp ../patches/SettingsScreen.kt app/src/main/java/com/maya/ai/presentation/settings/SettingsScreen.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:allowBackup="true"', 'android:allowBackup="true"\n        android:usesCleartextTraffic="true"')
          p.write_text(s)
          PY

      - name: Configure installable release signing
        working-directory: maya-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          import re
          pattern = r'(release\s*\{\s*)isMinifyEnabled\s*=\s*true'
          replacement = r'\1// Temporary installable CI signing; use a private keystore for distribution.\n            signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false'
          updated, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Could not safely locate release buildType block")
          p.write_text(updated)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Build signed release APK
        working-directory: maya-source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: Maya-AI-Free-release
          path: maya-source/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
